<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>sie7e — cine, videoclips y artworks</title>
  <meta name="description" content="sie7e es una productora y colectivo artístico: cine, videoclips y artworks.">
  <meta name="theme-color" content="#ece6e6">
  <link rel="canonical" href="https://imanosalinerospitale.github.io/Siete.creative/">

  <!-- Al compartir el link (WhatsApp, Instagram, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="sie7e — cine, videoclips y artworks">
  <meta property="og:description" content="Productora y colectivo artístico: cine, videoclips y artworks.">
  <meta property="og:url" content="https://imanosalinerospitale.github.io/Siete.creative/">
  <meta property="og:image" content="https://imanosalinerospitale.github.io/Siete.creative/Recursos/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="Recursos/favicon7.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .hero {
      width: 100%;
      min-height: 250px;
      padding: 100px 0 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-video {
      width: 68%;
      max-width: 850px;
      height: auto;
      pointer-events: none;
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.50, 1);
      transform-origin: center center;
    }

    /* Zoom del 15% al finalizar el video */
    .hero-video.zoomed {
      transform: scale(1.15);
    }

    .video-box {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      background-color: #ece6e6;
    }

    .video-box video {
      width: 100%;
      height: auto; /* con width/height en el HTML el navegador reserva el espacio y no "salta" */
      display: block;
      transition: transform 0.4s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .video-box video:hover {
        transform: scale(1.05);
      }
    }

    .video-box video:focus-visible {
      outline: 2px solid #111111;
      outline-offset: -4px;
    }

    /* Contacto */
    .contact {
      min-height: 100vh;
      min-height: 100svh; /* en celular no cuenta la barra del navegador */
      padding: 120px 24px 18vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      scroll-margin-top: 70px;
    }

    .contact form {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .contact h2 {
      font-size: 18px;
      font-weight: 400;
      text-transform: lowercase;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      text-transform: lowercase;
      color: #555555;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #111111;
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    /* Foco visible (sin mover el layout): engrosa la línea inferior */
    .field input:focus-visible,
    .field textarea:focus-visible {
      box-shadow: 0 2px 0 0 #111111;
    }

    .field textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      align-self: flex-start;
      background: transparent;
      border: 1px solid #111111;
      padding: 12px 28px;
      font: inherit;
      font-size: 14px;
      text-transform: lowercase;
      color: #111111;
      transition: background 0.2s, color 0.2s;
      -webkit-appearance: none;
      border-radius: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover:not(:disabled) {
        background: #111111;
        color: #ece6e6;
      }
    }

    .btn:disabled {
      opacity: 0.5;
    }

    .form-status {
      font-size: 13px;
      min-height: 1.4em;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 70px 0 20px;
        min-height: 180px;
      }

      .hero-video {
        width: 82%;
      }

      .contact {
        padding: 95px 20px 22vh;
        scroll-margin-top: 55px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links" aria-label="Principal">
      <a href="#home">sie7e</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <!-- Portada / Logo -->
  <main class="hero" id="home">
    <h1 class="visually-hidden">sie7e — cine, videoclips y artworks</h1>
    <video
      id="logo-video"
      class="hero-video"
      width="1280" height="720"
      autoplay
      muted
      playsinline
      disablepictureinpicture
      preload="auto"
      aria-label="Logo de sie7e animado">
      <source src="Recursos/logo2.mp4?v=4" type="video/mp4">
    </video>
  </main>

  <!-- Videos de muestra -->
  <!-- Solo se reproduce el que está en pantalla. Clic (o Enter/Espacio) para pausar. -->
  <section class="video-box" aria-label="Muestras de trabajo">
    <video
      class="autoplay-video"
      width="1920" height="1010"
      loop muted playsinline disablepictureinpicture
      preload="none"
      tabindex="0"
      poster="Recursos/poster1.jpg"
      data-mobile="Recursos/video1-mobile.mp4?v=4"
      aria-label="Muestra de trabajo 1 (sin audio). Clic para pausar o reproducir.">
      <source src="Recursos/video1.mp4?v=4" type="video/mp4">
    </video>
  </section>

  <section class="video-box">
    <video
      class="autoplay-video"
      width="1920" height="1080"
      loop muted playsinline disablepictureinpicture
      preload="none"
      tabindex="0"
      poster="Recursos/poster2.jpg"
      data-mobile="Recursos/video2-mobile.mp4?v=4"
      aria-label="Muestra de trabajo 2 (sin audio). Clic para pausar o reproducir.">
      <source src="Recursos/video2.mp4?v=4" type="video/mp4">
    </video>
  </section>

  <section class="video-box">
    <video
      class="autoplay-video"
      width="1920" height="1038"
      loop muted playsinline disablepictureinpicture
      preload="none"
      tabindex="0"
      poster="Recursos/poster3.jpg"
      data-mobile="Recursos/video3-mobile.mp4?v=4"
      aria-label="Muestra de trabajo 3 (sin audio). Clic para pausar o reproducir.">
      <source src="Recursos/video3.mp4?v=4" type="video/mp4">
    </video>
  </section>

  <!-- Contacto -->
  <section class="contact" id="contacto">
    <!--
      IMPORTANTE: reemplazá TU_ID por el ID de tu formulario de Formspree
      (formspree.io → New form → te da una URL tipo https://formspree.io/f/abcdwxyz).
      Alternativas equivalentes: Web3Forms, Getform, Basin.
    -->
    <form id="contact-form" action="https://formspree.io/f/TU_ID" method="POST">
      <h2>// contacto</h2>
      <div class="field">
        <label for="nombre">nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="mensaje">mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      </div>
      <!-- Trampa anti-spam: los bots lo completan, las personas no lo ven -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="visually-hidden" aria-hidden="true">
      <button type="submit" class="btn" id="submit-btn">enviar -></button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var smallScreen = window.matchMedia('(max-width: 700px)').matches;

      /* 1. Logo: animación + zoom al terminar */
      var logo = document.getElementById('logo-video');
      if (logo) {
        if (reduceMotion) {
          // Sin animación: se muestra directamente el último cuadro del logo
          logo.removeAttribute('autoplay');
          logo.addEventListener('loadedmetadata', function () {
            logo.currentTime = Math.max(0, logo.duration - 0.05);
          }, { once: true });
        } else {
          logo.addEventListener('ended', function () {
            logo.classList.add('zoomed');
          });
          logo.muted = true;
          var p = logo.play();
          if (p !== undefined) {
            p.catch(function () {
              // Si el navegador bloqueó el autoplay, arranca al primer toque/scroll
              var start = function () {
                logo.play();
                window.removeEventListener('touchstart', start);
                window.removeEventListener('scroll', start);
              };
              window.addEventListener('touchstart', start, { passive: true });
              window.addEventListener('scroll', start, { passive: true });
            });
          }
        }
      }

      /* 2. Videos de muestra: versión liviana en celular, play/pausa según visibilidad */
      var vids = document.querySelectorAll('.autoplay-video');

      vids.forEach(function (v) {
        if (smallScreen && v.dataset.mobile) {
          v.src = v.dataset.mobile; // pisa al <source> antes de que se descargue nada
        }
        if (reduceMotion) {
          v.controls = true; // sin reproducción automática: control manual
        }

        // Pausa / reproducción manual (clic o teclado)
        var toggle = function () {
          if (v.paused) { v.dataset.manualPause = ''; v.play().catch(function () {}); }
          else { v.dataset.manualPause = '1'; v.pause(); }
        };
        v.addEventListener('click', toggle);
        v.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
      });

      if (!reduceMotion) {
        if ('IntersectionObserver' in window) {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              var v = entry.target;
              if (entry.isIntersecting) {
                if (!v.dataset.manualPause) { v.play().catch(function () {}); }
              } else {
                v.pause();
              }
            });
          }, { threshold: 0.35 });
          vids.forEach(function (v) { io.observe(v); });
        } else {
          vids.forEach(function (v) { v.play().catch(function () {}); });
        }
      }

      /* 3. Formulario de contacto */
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('submit-btn');
      var status = document.getElementById('form-status');

      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          status.textContent = 'enviando...';
          btn.disabled = true;

          fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          })
            .then(function (res) {
              if (!res.ok) { throw new Error('http ' + res.status); }
              form.reset();
              status.textContent = 'gracias, recibimos tu mensaje.';
            })
            .catch(function () {
              status.textContent = 'no se pudo enviar. probá de nuevo en un rato.';
            })
            .then(function () {
              btn.disabled = false;
            });
        });
      }
    })();
  </script>
</body>
</html>
