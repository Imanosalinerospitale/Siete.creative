<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      font-family: 'Space Mono', monospace;
      color: #111111;
      overflow-x: hidden;
    }

    /* Barra de navegación superior fija */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      display: inline-block;
      text-decoration: none;
      color: #111111;
      font-size: 14px;
      text-transform: lowercase;
      letter-spacing: -0.2px;
      transition: transform 0.25s ease;
    }

    .nav-links a:hover {
      transform: scale(1.8);
    }

    /* 1. Sección Principal: Portada con GIF a pantalla completa */
    .hero-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-gif {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. Sección del Video en bucle a 100% ancho de pantalla */
    .video-section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .video-wrapper {
      width: 100%;
      display: block;
      overflow: hidden;
    }

    .loop-video {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Al pasar el mouse hace un zoom suave contenido */
    .loop-video:hover {
      transform: scale(1.05);
    }

    /* 3. Sección Contacto */
    .contact-section {
      min-height: 100vh;
      padding: 120px 24px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .contact-container {
      width: 100%;
      max-width: 540px;
    }

    .contact-title {
      font-size: 20px;
      font-weight: 400;
      text-transform: lowercase;
      margin-bottom: 40px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      text-transform: lowercase;
      color: #666666;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #111111;
      border-radius: 0;
      background: transparent;
      padding: 8px 0;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #111111;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .submit-btn {
      align-self: flex-start;
      margin-top: 10px;
      background: transparent;
      border: 1px solid #111111;
      padding: 12px 28px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      text-transform: lowercase;
      cursor: pointer;
      color: #111111;
      transition: background 0.2s, color 0.2s;
    }

    .submit-btn:hover {
      background: #111111;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .header { padding: 18px 12px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 13px; }
      .nav-links a:hover { transform: scale(1.3); }
      .contact-section { padding: 90px 20px 50px; }
    }
  </style>
</head>
<body>

  <!-- Barra de navegación en el top -->
  <header class="header">
    <nav>
      <ul class="nav-links">
        <li><a href="#home">home</a></li>
        <li><a href="#nosotros">nosotros</a></li>
        <li><a href="#proyectos">proyectos</a></li>
        <li><a href="#contacto">contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- 1. Portada con GIF -->
  <main class="hero-section" id="home">
    <img src="Recursos/logo1.gif" alt="Logo" class="hero-gif">
  </main>

  <!-- 2. Video en bucle al 100% de ancho de pantalla -->
  <section class="video-section" id="video">
    <div class="video-wrapper">
      <video class="loop-video" autoplay loop muted playsinline>
        <source src="Recursos/video1.mp4" type="video/mp4">
        Tu navegador no soporta reproducción de video.
      </video>
    </div>
  </section>

  <!-- 3. Formulario de Contacto -->
  <section class="contact-section" id="contacto">
    <div class="contact-container">
      <h2 class="contact-title">// contacto</h2>

      <form class="contact-form">
        <div class="form-group">
          <label for="nombre">nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
          <label for="email">email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="mensaje">mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
        </div>

        <button type="submit" class="submit-btn">enviar -></button>
      </form>
    </div>
  </section>

</body>
</html>
