<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>sie7e</title>

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="Recursos/favicon7.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .hero {
      width: 100%;
      min-height: 250px;
      padding: 100px 0 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-video {
      width: 68%;
      max-width: 850px;
      height: auto;
      pointer-events: none;
      background: transparent !important;
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.50, 1);
      transform-origin: center center;
    }

    /* Zoom del 15% al finalizar el video */
    .hero-video.zoomed {
      transform: scale(1.15);
    }

    .video-box {
      width: 100%;
      min-height: 300px; /* Evita que el contenedor colapse si el video tarda en cargar */
      display: flex;
      justify-content: center;
      overflow: hidden;
      background-color: #ece6e6;
    }

    .video-box video {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
      background: transparent;
    }

    @media (hover: hover) and (pointer: fine) {
      .video-box video:hover {
        transform: scale(1.05);
      }
    }

    /* Contacto */
    .contact {
      min-height: 100vh;
      padding: 120px 24px 18vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      scroll-margin-top: 70px;
    }

    .contact form {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .contact h2 {
      font-size: 18px;
      font-weight: 400;
      text-transform: lowercase;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      text-transform: lowercase;
      color: #555555;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #111111;
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    .field textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      align-self: flex-start;
      background: transparent;
      border: 1px solid #111111;
      padding: 12px 28px;
      font: inherit;
      font-size: 14px;
      text-transform: lowercase;
      transition: background 0.2s, color 0.2s;
      -webkit-appearance: none;
      border-radius: 0;
    }

    .btn:hover {
      background: #111111;
      color: #ece6e6;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 70px 0 20px;
        min-height: 180px;
      }

      .hero-video {
        width: 82%;
      }

      .video-box {
        min-height: 200px;
      }

      .contact {
        padding: 95px 20px 22vh;
        scroll-margin-top: 55px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links">
      <a href="#home">sie7e</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto" id="link-contacto">contacto</a>
    </nav>
  </header>

  <!-- Portada / Logo -->
  <main class="hero" id="home">
    <video 
      id="logo-video" 
      class="hero-video" 
      autoplay 
      muted 
      playsinline 
      webkit-playsinline 
      disablepictureinpicture 
      preload="metadata">
      <source src="Recursos/logo2.mov" type='video/mp4; codecs="hvc1"'>
      <source src="Recursos/logo2.webm" type="video/webm">
    </video>
  </main>

  <!-- Videos de muestra -->
  <section class="video-box">
    <video 
      class="autoplay-video" 
      autoplay 
      loop 
      muted 
      playsinline 
      webkit-playsinline 
      disablepictureinpicture 
      preload="metadata">
      <source src="Recursos/video1.mp4?v=3" type="video/mp4">
    </video>
  </section>

  <section class="video-box">
    <video 
      class="autoplay-video" 
      autoplay 
      loop 
      muted 
      playsinline 
      webkit-playsinline 
      disablepictureinpicture 
      preload="metadata">
      <source src="Recursos/video2.mp4?v=3" type="video/mp4">
    </video>
  </section>

  <section class="video-box">
    <video 
      class="autoplay-video" 
      autoplay 
      loop 
      muted 
      playsinline 
      webkit-playsinline 
      disablepictureinpicture 
      preload="metadata">
      <source src="Recursos/video3.mp4?v=3" type="video/mp4">
    </video>
  </section>

  <!-- Contacto -->
  <section class="contact" id="contacto">
    <form>
      <h2>// contacto</h2>
      <div class="field">
        <label for="nombre">nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="mensaje">mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn">enviar -></button>
    </form>
  </section>

  <script>
    // 1. Zoom al terminar el logo
    const logoVideo = document.getElementById('logo-video');
    if (logoVideo) {
      logoVideo.addEventListener('ended', function() {
        logoVideo.classList.add('zoomed');
      });
    }

    // 2. Reproducción segura sin colgar el navegador
    document.addEventListener('DOMContentLoaded', () => {
      const videos = document.querySelectorAll('video');
      videos.forEach(v => {
        v.muted = true;
        const playPromise = v.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Si el navegador bloqueó el autoplay inicial, arranca al primer toque/scroll
            const startVideos = () => {
              v.play();
              window.removeEventListener('touchstart', startVideos);
              window.removeEventListener('scroll', startVideos);
            };
            window.addEventListener('touchstart', startVideos, { passive: true });
            window.addEventListener('scroll', startVideos, { passive: true });
          });
        }
      });
    });

    // 3. Scroll suave a contacto
    const contactLink = document.getElementById('link-contacto');
    const contactSection = document.getElementById('contacto');
    if (contactLink && contactSection) {
      contactLink.addEventListener('click', function(e) {
        e.preventDefault();
        contactSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.pushState(null, null, '#contacto');
      });
    }
  </script>
</body>
</html>
