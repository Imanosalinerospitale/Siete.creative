<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sie7e — colectivo artístico & productora audiovisual</title>
  <meta name="description" content="Colectivo artístico y productora audiovisual basada en Córdoba, Argentina.">
  <meta name="theme-color" content="#ece6e6">

  <link rel="icon" type="image/svg+xml" href="Recursos/favicon7.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=24">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #ece6e6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Logo Animado de Entrada (Doble de tamaño) */
    .hero-logo-container {
      width: 100%;
      max-width: 960px; /* Tamaño duplicado para mayor impacto visual */
      margin: 130px auto 50px;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .hero-logo-video {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Sección de videos a ancho completo (Full Width) */
    .hero-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .hero-video-wrapper {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }

    .hero-bg-video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Sección de Formulario de Contacto (Estilo Minimalista SIE7E) */
    .contact-section {
      max-width: 760px;
      margin: 100px auto 80px;
      padding: 0 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .contact-section h2 {
      font-size: 16px;
      font-weight: 400;
      text-transform: lowercase;
      margin-bottom: 36px;
      color: #111111;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      color: #555555;
      text-transform: lowercase;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: transparent;
      border: 1px solid #111111;
      font-family: inherit;
      font-size: 14px;
      color: #111111;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #000000;
      background: rgba(17, 17, 17, 0.02);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 140px;
      line-height: 1.6;
    }

    .submit-btn {
      align-self: flex-start;
      background: transparent;
      color: #111111;
      border: 1px solid #111111;
      padding: 12px 28px;
      font-family: inherit;
      font-size: 13px;
      text-transform: lowercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: #111111;
      color: #ece6e6;
    }

    @media (max-width: 768px) {
      .hero-logo-container {
        margin: 100px auto 30px;
        max-width: 100%;
      }

      .contact-section {
        margin: 60px auto 50px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links" aria-label="Principal">
      <a href="index.html" aria-current="page">sie7e</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <main>
    <!-- Logo Animado de Entrada (Doble de tamaño) -->
    <div class="hero-logo-container">
      <video autoplay loop muted playsinline preload="auto" class="hero-logo-video">
        <source src="Recursos/logo2.mov" type="video/quicktime; codecs=hvc1">
        <source src="Recursos/logo2.webm" type="video/webm">
      </video>
    </div>

    <!-- Videos a Ancho Completo (Full Width) -->
    <section class="hero-section">
      <!-- Video Portada 1 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada1.mp4" type="video/mp4">
        </video>
      </div>

      <!-- Video Portada 2 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada2.mp4" type="video/mp4">
        </video>
      </div>

      <!-- Video Portada 3 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada3.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- Sección de Formulario de Contacto -->
    <section class="contact-section" id="contacto">
      <h2>// contacto</h2>
      <form class="contact-form" action="https://formspree.io/f/TU_FORM_ID" method="POST">
        <div class="form-group">
          <label for="name">nombre / productora / proyecto</label>
          <input type="text" id="name" name="name" required placeholder="tu nombre o proyecto">
        </div>
        <div class="form-group">
          <label for="email">email</label>
          <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="message">mensaje</label>
          <textarea id="message" name="message" required placeholder="contanos de qué se trata tu propuesta..."></textarea>
        </div>
        <button type="submit" class="submit-btn">[ enviar mensaje ]</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <span>córdoba, argentina</span>
      <a href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener noreferrer">instagram</a>
      <span>© 2026 sie7e. todos los derechos reservados.</span>
    </div>
  </footer>

</body>
</html>
