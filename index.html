<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>

  <!-- Fuente Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth; /* Desplazamiento suave al tocar los links del menú */
    }

    body {
      background: #ffffff;
      font-family: 'Space Mono', monospace;
      color: #111111;
      overflow-x: hidden;
    }

    /* Navegación fija y centrada */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      display: inline-block;
      text-decoration: none;
      color: #111;
      font-size: 14px;
      text-transform: lowercase;
      letter-spacing: -0.2px;
      transition: transform 0.25s ease;
    }

    .nav-links a:hover {
      transform: scale(2);
    }

    /* Sección Principal: GIF a pantalla completa */
    .hero-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-gif {
      width: 100%;
      height: auto;
      display: block;
    }

      padding: 120px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }
