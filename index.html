<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #ece6e6;
      font-family: 'Space Mono', monospace;
      color: #111111;
      overflow-x: hidden;
    }

    /* Navegación fija */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: rgba(236, 230, 230, 0.95);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      display: inline-block;
      text-decoration: none;
      color: #111111;
      font-size: 14px;
      text-transform: lowercase;
      letter-spacing: -0.2px;
      transition: transform 0.2s ease;
    }

    .nav-links a:hover {
      transform: scale(1.8);
    }

    /* GIF de portada */
    .hero {
      width: 100%;
      padding-top: 70px;
      padding-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Videos en loop */
    .video-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-box video {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .video-box video:hover {
      transform: scale(1.05);
    }

    /* Contacto */
    .contact {
      min-height: 100vh;
      padding: 100px 24px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ece6e6;
    }

    .contact form {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .contact h2 {
      font-size: 18px;
      font-weight: 400;
      text-transform: lowercase;
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      text-transform: lowercase;
      color: #555555;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #111111;
      border-radius: 0;
      background: transparent;
      padding: 6px 0;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #111111;
      outline: none;
    }

    .field textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      align-self: flex-start;
      margin-top: 8px;
      background: transparent;
      border: 1px solid #111111;
      padding: 10px 24px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      text-transform: lowercase;
      cursor: pointer;
      color: #111111;
      transition: background 0.2s, color 0.2s;
    }

    .btn:hover {
      background: #111111;
      color: #ece6e6;
    }

    @media (max-width: 600px) {
      .header { padding: 14px; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 12px; }
      .nav-links a:hover { transform: scale(1.3); }
      .hero { padding-top: 55px; }
      .contact { padding: 80px 16px 40px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links">
      <a href="#home">home</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <main class="hero" id="home">
    <img src="Recursos/logo2.gif" alt="Logo">
  </main>

  <section class="video-box">
    <video autoplay loop muted playsinline>
      <source src="Recursos/video1.mp4" type="video/mp4">
    </video>
  </section>

  <section class="video-box">
    <video autoplay loop muted playsinline>
      <source src="Recursos/video2.mp4" type="video/mp4">
    </video>
  </section>

  <section class="contact" id="contacto">
    <form>
      <h2>// contacto</h2>
      <div class="field">
        <label for="nombre">nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="mensaje">mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn">enviar -></button>
    </form>
  </section>

</body>
</html>
