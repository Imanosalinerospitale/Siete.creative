<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>

  <!-- Fuente Space Mono de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      font-family: 'Space Mono', monospace;
      color: #111111;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra de navegación superior */
    .header {
      width: 100%;
      padding: 28px 40px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .navbar {
      display: flex;
      justify-content: flex-end;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .nav-links a {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      text-decoration: none;
      color: #111111;
      font-size: 14px;
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: -0.2px;
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
    }

    /* Al pasar el mouse duplica el tamaño */
    .nav-links a:hover {
      transform: scale(2);
      opacity: 1;
    }

    /* Contenedor principal a ancho completo */
    .hero-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* GIF ocupando el 100% del ancho */
    .hero-gif {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Ajustes para celulares */
    @media (max-width: 600px) {
      .header {
        padding: 20px 16px;
      }

      .navbar {
        justify-content: center;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-links a {
        font-size: 13px;
      }

      .nav-links a:hover {
        transform: scale(1.5); /* Escala más contenida en mobile para no desbordar */
      }
    }
  </style>
</head>
<body>

  <!-- Barra de navegación en el top -->
  <header class="header">
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#home">home</a></li>
        <li><a href="#nosotros">nosotros</a></li>
        <li><a href="#proyectos">proyectos</a></li>
        <li><a href="#contacto">contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- GIF ocupando el 100% del ancho -->
  <main class="hero-section" id="home">
    <div class="logo-container">
      <img src="Recursos/logo1.gif" alt="Logo animado" class="hero-gif">
    </div>
  </main>

</body>
</html>
