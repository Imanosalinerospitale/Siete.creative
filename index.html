<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIE7E Creativo</title>
  <meta name="description" content="Colectivo artístico y productora audiovisual basada en Córdoba, Argentina.">
  <meta name="theme-color" content="#ece6e6">

  <link rel="icon" type="image/svg+xml" href="Recursos/favicon7.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=28">

  <style>
    /* Ajuste de margen superior para dar espacio al header amplio */
    .hero-logo-container {
      width: 100%;
      max-width: 960px;
      margin: 170px auto 50px;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .hero-logo-video {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Videos a ancho completo (Full Width) */
    .hero-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .hero-video-wrapper {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }

    .hero-bg-video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: transform;
    }

    /* Formulario Minimalista */
    .contact-section {
      max-width: 760px;
      margin: 100px auto 80px;
      padding: 0 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .contact-section h2 {
      font-size: 16px;
      font-weight: 400;
      text-transform: lowercase;
      margin-bottom: 48px;
      color: #111111;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group label {
      font-size: 13px;
      color: #333333;
      text-transform: lowercase;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid #111111;
      font-size: 14px;
      color: #111111;
      box-sizing: border-box;
      outline: none;
      border-radius: 0;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }

    .submit-btn {
      align-self: flex-start;
      background: transparent;
      color: #111111;
      border: 1px solid #111111;
      padding: 14px 28px;
      font-size: 13px;
      text-transform: lowercase;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: #111111;
      color: #ece6e6;
    }

    @media (max-width: 768px) {
      .hero-logo-container {
        margin: 140px auto 30px;
      }

      .contact-section {
        margin: 60px auto 50px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links" aria-label="Principal">
      <a href="index.html" aria-current="page">sie7e</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <main>
    <!-- Logo Animado de Entrada -->
    <div class="hero-logo-container">
      <video autoplay loop muted playsinline preload="auto" class="hero-logo-video">
        <source src="Recursos/logo2.mov" type="video/quicktime; codecs=hvc1">
        <source src="Recursos/logo2.webm" type="video/webm">
      </video>
    </div>

    <!-- Videos a Ancho Completo (Optimización de Carga Diferida) -->
    <section class="hero-section">
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada1.mp4" type="video/mp4">
        </video>
      </div>

      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="metadata" class="hero-bg-video">
          <source src="Recursos/portada2.mp4" type="video/mp4">
        </video>
      </div>

      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="metadata" class="hero-bg-video">
          <source src="Recursos/portada3.mp4" type="video/mp4">
        </video>
      </div>
    </section>

<!-- Sección de Formulario de Contacto -->
    <section class="contact-section" id="contacto">
      <h2>// contacto</h2>
      <form class="contact-form" action="https://formspree.io/f/xkjjedvq" method="POST">
        <div class="form-group">
          <label for="name">nombre</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">mensaje</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">enviar -></button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <span>córdoba, argentina</span>
      <a href="https://instagram.com/siete.creative" target="_blank" rel="noopener noreferrer">instagram</a>
      <span>© 2026 sie7e. todos los derechos reservados.</span>
    </div>
  </footer>

</body>
</html>
