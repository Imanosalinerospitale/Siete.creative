<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sie7e — colectivo artístico & productora audiovisual</title>
  <meta name="description" content="Colectivo artístico y productora audiovisual basada en Córdoba, Argentina.">
  <meta name="theme-color" content="#ece6e6">

  <link rel="icon" type="image/svg+xml" href="Recursos/favicon7.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=22">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #ece6e6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Logo Animado */
    .hero-logo-container {
      width: 100%;
      max-width: 480px;
      margin: 120px auto 40px;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-logo-video {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Sección de videos a ancho completo de pantalla (Full Width) */
    .hero-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0; /* Sin espacio o ajustá el gap según prefieras */
    }

    .hero-video-wrapper {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }

    .hero-bg-video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      /* Mantiene nitidez pura y activa aceleración por hardware */
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
      will-change: transform;
    }

    @media (max-width: 600px) {
      .hero-logo-container {
        margin: 95px auto 30px;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links" aria-label="Principal">
      <a href="index.html" aria-current="page">sie7e</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <main>
    <!-- Logo Animado de Entrada -->
    <div class="hero-logo-container">
      <video autoplay loop muted playsinline preload="auto" class="hero-logo-video">
        <source src="Recursos/logo.mov" type="video/quicktime; codecs=hvc1">
        <source src="Recursos/logo.webm" type="video/webm">
      </video>
    </div>

    <!-- Videos a Ancho Completo (Full Width) -->
    <section class="hero-section">
      <!-- Video Portada 1 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada1.mp4" type="video/mp4">
        </video>
      </div>

      <!-- Video Portada 2 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada2.mp4" type="video/mp4">
        </video>
      </div>

      <!-- Video Portada 3 -->
      <div class="hero-video-wrapper">
        <video autoplay loop muted playsinline preload="auto" class="hero-bg-video">
          <source src="Recursos/portada3.mp4" type="video/mp4">
        </video>
      </div>
    </section>
  </main>

  <footer class="footer" id="contacto">
    <div class="footer-content">
      <span>córdoba, argentina</span>
      <a href="https://instagram.com/TU_USUARIO" target="_blank" rel="noopener noreferrer">instagram</a>
      <span>© 2026 sie7e. todos los derechos reservados.</span>
    </div>
  </footer>

</body>
</html>
