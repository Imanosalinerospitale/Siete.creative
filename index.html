<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:#ece6e6; font-family:'Space Mono',monospace; color:#111; overflow-x:hidden; }

    /* Nav fija y centrada */
    .header { position:fixed; top:0; left:0; width:100%; padding:20px; display:flex; justify-content:center; background:rgba(236,230,230,0.95); backdrop-filter:blur(5px); z-index:10; }
    .nav { display:flex; gap:28px; list-style:none; }
    .nav a { display:inline-block; text-decoration:none; color:#111; font-size:14px; text-transform:lowercase; transition:transform .2s ease; }
    .nav a:hover { transform:scale(1.8); }

    /* Medios a pantalla completa (GIF y Video) */
    .hero, .video-box { width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .hero { min-height:100vh; }
    .hero img, .video-box video { width:100%; height:auto; display:block; }
    .video-box video { cursor:pointer; transition:transform .4s ease; }
    .video-box video:hover { transform:scale(1.05); }

    /* Contacto */
    .contact { min-height:100vh; padding:100px 20px 60px; display:flex; align-items:center; justify-content:center; }
    .contact form { width:100%; max-width:520px; display:flex; flex-direction:column; gap:28px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-size:12px; color:#555; }
    .field input, .field textarea { width:100%; border:none; border-bottom:1px solid #111; border-radius:0; background:none; padding:6px 0; font:14px 'Space Mono',monospace; outline:none; }
    .field textarea { resize:vertical; min-height:70px; }
    .btn { align-self:flex-start; background:none; border:1px solid #111; padding:10px 24px; font:13px 'Space Mono',monospace; cursor:pointer; transition:.2s; }
    .btn:hover { background:#111; color:#ece6e6; }

    @media(max-width:600px) {
      .header { padding:14px; }
      .nav { gap:14px; }
      .nav a { font-size:12px; }
      .nav a:hover { transform:scale(1.3); }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav">
      <a href="#home">home</a>
      <a href="#nosotros">nosotros</a>
      <a href="#proyectos">proyectos</a>
      <a href="#contacto">contacto</a>
    </nav>
  </header>

  <!-- Portada con GIF -->
  <main class="hero"
