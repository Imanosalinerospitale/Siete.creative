  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .projects-container {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px 80px;
      width: 100%;
    }

    h1 {
      margin-bottom: 40px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
    }

    .project-card {
      border: 1px solid #111111;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    a.project-card:focus-visible {
      background: #111111;
      color: #ece6e6;
    }

    @media (hover: hover) and (pointer: fine) {
      a.project-card:hover {
        background: #111111;
        color: #ece6e6;
        transform: translateY(-3px);
      }
    }

    .project-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: lowercase;
    }

    .project-category {
      font-size: 12px;
      opacity: 0.7;
      text-transform: lowercase;
    }

    @media (max-width: 600px) {
      .projects-container { padding: 90px 16px 50px; }
    }
  </style>
</head>
