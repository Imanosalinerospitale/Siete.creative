  <style>
    body { min-height: 100vh; }
    .projects-container { max-width: 1100px; margin: 0 auto; padding: 120px 24px 60px; }
    h1 { font-size: 20px; font-weight: 400; text-transform: lowercase; margin-bottom: 40px; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px; }
    .project-card { border: 1px solid #111; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; transition: 0.2s ease; }
    .project-card:hover { background: #111; color: #ece6e6; transform: translateY(-3px); }
    .project-title { font-size: 16px; font-weight: 700; text-transform: lowercase; }
    .project-category { font-size: 12px; opacity: 0.7; text-transform: lowercase; }
    @media (max-width: 600px) { .projects-container { padding: 90px 16px 40px; } }
  </style>
</head>

    <nav class="nav-links">

    </nav>

  <main class="projects-container">

      <div class="project-card"><span class="project-title">Proyecto 02</span><span class="project-category">publicidad / 2026</span></div>
