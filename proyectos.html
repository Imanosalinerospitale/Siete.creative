<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ece6e6;
      font-family: 'Space Mono', monospace;
      color: #111111;
      min-height: 100vh;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: rgba(236, 230, 230, 0.95);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .nav-links { display: flex; gap: 28px; }
    .nav-links a {
      display: inline-block;
      text-decoration: none;
      color: #111111;
      font-size: 14px;
      text-transform: lowercase;
      letter-spacing: -0.2px;
      transition: transform 0.2s ease;
    }
    .nav-links a:hover { transform: scale(1.8); }

    .projects-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 24px 60px;
    }

    h1 {
      font-size: 20px;
      font-weight: 400;
      text-transform: lowercase;
      margin-bottom: 40px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
    }

    .project-card {
      border: 1px solid #111111;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .project-card:hover {
      background: #111111;
      color: #ece6e6;
      transform: translateY(-3px);
    }

    .project-title { font-size: 16px; font-weight: 700; text-transform: lowercase; }
    .project-category { font-size: 12px; opacity: 0.7; text-transform: lowercase; }

    @media (max-width: 600px) {
      .header { padding: 14px; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 12px; }
      .nav-links a:hover { transform: scale(1.3); }
      .projects-container { padding: 90px 16px 40px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="nav-links">
      <a href="index.html#home">home</a>
      <a href="nosotros.html">nosotros</a>
      <a href="proyectos.html">proyectos</a>
      <a href="index.html#contacto">contacto</a>
    </nav>
  </header>

  <main class="projects-container">
    <h1>// proyectos</h1>
    <div class="projects-grid">
      <div class="project-card">
        <span class="project-title">Proyecto 01</span>
        <span class="project-category">audiovisual / 2026</span>
      </div>
      <div class="project-card">
        <span class="project-title">Proyecto 02</span>
        <span class="project-category">publicidad / 2026</span>
      </div>
      <div class="project-card">
        <span class="project-title">Proyecto 03</span>
        <span class="project-category">narrativa / 2026</span>
      </div>
    </div>
  </main>

</body>
</html>
